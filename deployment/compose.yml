# LAN ONLY. Keep the existing project name for compatible upgrades.
# Both host-network services bind to INKSIGHT_HOST; do not expose them publicly.
name: inksight
services:
  backend:
    image: ${INKSIGHT_BACKEND_IMAGE:-miaomo-server-backend:local}
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
      network: host
    network_mode: host
    restart: unless-stopped
    env_file: deployment/backend.env
    environment:
      INKSIGHT_BIND_HOST: ${INKSIGHT_HOST:-127.0.0.1}
      INKSIGHT_BACKEND_PORT: ${INKSIGHT_BACKEND_PORT:-8080}
      INKSIGHT_ALLOWED_HOSTS: ${INKSIGHT_HOST:-127.0.0.1}
      INKSIGHT_CORS_ORIGINS: http://${INKSIGHT_HOST:-127.0.0.1}:${INKSIGHT_WEB_PORT:-3000}
      INKSIGHT_PRIMARY_WEBAPP_URL: http://${INKSIGHT_HOST:-127.0.0.1}:${INKSIGHT_WEB_PORT:-3000}
      INKSIGHT_LOCAL_USER_ID: '1'
      INKSIGHT_UPLOADS_MAX_AGE_DAYS: '0'
      INKSIGHT_UPLOADS_MAX_TOTAL_MB: '0'
    volumes:
      - ./data:/data
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; h=os.getenv('INKSIGHT_BIND_HOST','127.0.0.1'); h='127.0.0.1' if h=='0.0.0.0' else h; urllib.request.urlopen('http://'+h+':'+os.getenv('INKSIGHT_BACKEND_PORT','8080')+'/api/health',timeout=5)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s
  web:
    image: ${INKSIGHT_WEB_IMAGE:-miaomo-server-web:local}
    build:
      context: .
      dockerfile: deployment/Dockerfile.web
      network: host
    network_mode: host
    restart: unless-stopped
    environment:
      INKSIGHT_BACKEND_API_BASE: http://${INKSIGHT_HOST:-127.0.0.1}:${INKSIGHT_BACKEND_PORT:-8080}
      INKSIGHT_ALLOWED_WEB_HOSTS: ${INKSIGHT_HOST:-127.0.0.1}
      NEXT_TELEMETRY_DISABLED: '1'
      HOSTNAME: ${INKSIGHT_HOST:-127.0.0.1}
      PORT: ${INKSIGHT_WEB_PORT:-3000}
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
